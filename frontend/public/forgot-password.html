<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — UK Sponsor Licence Tracker</title>
</head>
<body>
  <h1>Reset password</h1>
  <form id="reset-form">
    <p><label>Username<br /><input id="username" type="text" autocomplete="username" required /></label></p>
    <p><label>New password<br /><input id="new-password" type="password" autocomplete="new-password" required /></label></p>
    <p><label>Reset token<br /><input id="reset-token" type="text" required /></label></p>
    <p><button type="submit" id="submit-btn">Reset password</button></p>
    <p id="error" hidden style="color:red"></p>
  </form>
  <p><a href="/login.html">Back to login</a></p>
  <script>
    document.getElementById('reset-form').addEventListener('submit', async function(e) {
      e.preventDefault()
      const btn = document.getElementById('submit-btn')
      const error = document.getElementById('error')
      btn.disabled = true
      error.hidden = true
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            new_password: document.getElementById('new-password').value,
            reset_token: document.getElementById('reset-token').value,
          }),
        })
        if (!res.ok) throw new Error(await res.text())
        window.location.href = '/login.html'
      } catch (err) {
        error.textContent = err.message || 'Reset failed'
        error.hidden = false
        btn.disabled = false
      }
    })
  </script>
</body>
</html>
